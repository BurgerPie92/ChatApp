name: TestJava

on:
  push:
    branches:
      - main
      - part2-sending-messages
  pull_request:
    branches:
      - main
      - part2-sending-messages

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        run: mvn --batch-mode test
